name: Refresh public profile statistics

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'
  push:
    branches: [main]
    paths:
      - scripts/update_stats.py
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read public GitHub statistics
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_stats.py
      - name: Save updated card
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-stats.svg assets/github-stats.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update public profile statistics'
            git push
          fi
